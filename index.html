<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glossa Translations — every language, checked three times</title>
<meta name="description" content="Translation and localization into 120+ languages. Three checks on every text. Your price within 15 minutes, −10% on your first order.">
<meta property="og:title" content="Glossa Translations">
<meta property="og:description" content="Translation into 120+ languages. Checked three times. Price in 15 minutes.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#09090b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Glossa Translations"><span class="wm"><b>Gloss<i>a</i></b></span><small>translations</small></a>
    <nav class="nav" aria-label="Main">
      <a href="#services" data-i="nav.services"></a>
      <a href="#price" data-i="nav.faq"></a>
      <a href="#contacts" data-i="nav.contacts"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ua">UA</button></div>
    <a class="btn btn-primary" href="#price" data-i="cta.quote"></a>
  </div>
</header>

<main id="main">
  <!-- one scene: the globe stays, the text changes as you scroll -->
  <section class="cena" data-cena style="--ecras:4" aria-label="Glossa">
    <div class="palco">
      <canvas id="globe" aria-hidden="true"></canvas>

      <div class="beat b-hero" data-beat data-de="0" data-ate=".22">
        <h1 class="morph"><span class="sr">Translation</span><span class="w" aria-hidden="true">Translation</span><span class="lng" aria-hidden="true">EN</span></h1>
        <p class="line" data-i="h.line"></p>
        <div class="ctas"><a class="btn btn-primary" href="#price"><span data-i="cta.quote"></span> <span class="ar" aria-hidden="true">→</span></a></div>
        <p class="hint" aria-hidden="true"><i></i><span data-i="scroll"></span></p>
      </div>

      <div class="beat b-side" data-beat data-de=".24" data-ate=".46">
        <p class="big"><span data-conta="120">120</span>+</p>
        <h2 data-i="b2.t"></h2>
        <p class="line" data-i="b2.p"></p>
      </div>

      <div class="beat b-side" data-beat data-de=".5" data-ate=".72">
        <h2 data-i="b3.t"></h2>
        <ol class="three">
          <li><b>1</b><span data-i="b3.1"></span></li>
          <li><b>2</b><span data-i="b3.2"></span></li>
          <li><b>3</b><span data-i="b3.3"></span></li>
        </ol>
      </div>

      <div class="beat b-side" data-beat data-de=".76" data-ate="1.01">
        <h2 data-i="b4.t"></h2>
        <p class="tag10" data-i="b4.p"></p>
        <div class="ctas"><a class="btn btn-primary" href="#price"><span data-i="cta.quote"></span> <span class="ar" aria-hidden="true">→</span></a></div>
      </div>

      <div class="bar-p" aria-hidden="true"><b data-progresso-pagina></b></div>
    </div>
  </section>

  <section class="proof" aria-label="Clients">
    <p class="wrap" data-i="proof"></p>
    <div class="faixa" data-faixa>
      <div class="faixa__trilho">
        <svg viewBox="0 0 92 32" role="img" aria-label="1win"><text x="0" y="25" fill="currentColor" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-style="italic" font-size="27" letter-spacing="-1">1win</text></svg>
        <svg viewBox="0 0 196 32" role="img" aria-label="Parimatch"><text x="0" y="25" fill="currentColor" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="24" letter-spacing="-.5">PARIMATCH</text></svg>
        <svg viewBox="0 0 120 32" role="img" aria-label="GGPro"><rect x="1" y="3" width="44" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="23" y="24" text-anchor="middle" fill="currentColor" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="18">GG</text><text x="52" y="24" fill="currentColor" font-family="Arial,sans-serif" font-weight="700" font-size="20" letter-spacing="2">PRO</text></svg>
        <svg viewBox="0 0 70 32" role="img" aria-label="Uber"><text x="0" y="25" fill="currentColor" font-family="Helvetica Neue,Arial,sans-serif" font-weight="500" font-size="28" letter-spacing="-.5">Uber</text></svg>
        <svg viewBox="0 0 168 32" role="img" aria-label="WhiteBIT"><path d="M3 6h9l-4.5 20z" fill="currentColor"/><path d="M13 6h9l-4.5 20z" fill="currentColor" opacity=".55"/><text x="30" y="24" fill="currentColor" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="20" letter-spacing=".5">WHITEBIT</text></svg>
        <svg viewBox="0 0 150 32" role="img" aria-label="Microsoft"><rect x="0" y="4" width="11" height="11" fill="currentColor"/><rect x="13" y="4" width="11" height="11" fill="currentColor" opacity=".8"/><rect x="0" y="17" width="11" height="11" fill="currentColor" opacity=".8"/><rect x="13" y="17" width="11" height="11" fill="currentColor" opacity=".6"/><text x="32" y="24" fill="currentColor" font-family="Segoe UI,Arial,sans-serif" font-weight="600" font-size="22">Microsoft</text></svg>
      </div>
    </div>
  </section>

  <section id="services" class="svc-sec">
    <div class="wrap">
      <h2 class="t" data-i="sv.h"></h2>
      <ul class="chips" data-cai>
        <li><span data-i="sv.1"></span></li>
        <li><span data-i="sv.2"></span></li>
        <li><span data-i="sv.3"></span></li>
        <li><span data-i="sv.4"></span></li>
        <li><span data-i="sv.5"></span></li>
        <li><span data-i="sv.6"></span></li>
        <li><span data-i="sv.7"></span></li>
        <li><span data-i="sv.8"></span></li>
      </ul>
    </div>
  </section>

  <section id="price" class="price-sec">
    <div class="wrap">
      <div class="req">
        <div class="side"><h2 data-i="cost.h"></h2><p data-i="cost.p"></p></div>
        <div data-form="cost"></div>
      </div>
    </div>
  </section>
</main>

<footer id="contacts">
  <div class="wrap">
    <a class="logo" href="index.html"><span class="wm"><b>Gloss<i>a</i></b></span><small>translations</small></a>
    <nav><a href="mailto:hi@glossa-translations.com">hi@glossa-translations.com</a><a href="https://t.me/glossa_translations" target="_blank" rel="noopener">Telegram</a><a href="order.html" data-i="cta.quote"></a><a href="privacy.html" data-i="foot.privacy"></a></nav>
    <span class="copy">© 2026 Glossa Translations</span>
  </div>
</footer>

<div class="exit" hidden role="dialog" aria-modal="true" aria-labelledby="exit-h">
  <div class="exit__card">
    <button class="exit__x" type="button" aria-label="Close">×</button>
    <p class="exit__k">−10%</p>
    <h2 id="exit-h" data-i="ex.h"></h2>
    <p class="exit__p" data-i="ex.p"></p>
    <div data-form="cost"></div>
  </div>
</div>

<div class="cookie" hidden><span data-i="cookie.t"></span><button class="btn" type="button" data-i="cookie.ok"></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script src="js/scroll.js"></script>
<script src="js/hero.js"></script>
<script src="js/exit.js"></script>
</body>
</html>
