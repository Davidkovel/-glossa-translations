<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Glossa Translations">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#2b44f0"/><path d="M24.5 13.2A8 8 0 1 0 25 20h-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="wm"><b>Glossa</b><span>translations</span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="index.html#services" data-i="nav.services"></a>
      <a href="index.html#quality" data-i="nav.qa"></a>
      <a href="index.html#faq" data-i="nav.faq"></a>
      <a href="#contacts" data-i="nav.contacts"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ua">UA</button></div>
  </div>
</header>

<main class="quick">
  <div class="wrap">
    <div>
      <h1 data-i="form.h"></h1>
      <div data-form="quick"></div>
    </div>
    <aside class="person">
      <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></div>
      <b data-i="form.boss"></b>
      <span data-i="form.bossname"></span>
      <div class="contact"><a href="mailto:hi@glossa-translations.com">hi@glossa-translations.com</a><a href="https://t.me/glossa_translations" target="_blank" rel="noopener">Telegram @glossa_translations</a></div>
    </aside>
  </div>
</main>

<footer id="contacts">
  <div class="wrap">
    <div class="bottom" style="margin-top:0;border-top:0;padding-top:0"><span>© 2026 Glossa Translations. <span data-i="foot.rights"></span></span><a href="privacy.html" data-i="foot.privacy"></a></div>
  </div>
</footer>

<div class="cookie" hidden><span data-i="cookie.t"></span><button class="btn" type="button" data-i="cookie.ok"></button></div>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>

</html>
